<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles/index.css">
    <title>Product Details - Supreme Wears</title>
</head>
<body class="bg-gray-50 font-sans antialiased text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- HEADER & NAVIGATION -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50">
        <nav class="flex flex-col mx-4 my-3 lg:mx-8 bg-white rounded-2xl shadow-sm border border-gray-200/80 transition-all duration-300">
            <div class="flex justify-between items-center px-6 py-3">
                <a href="../index.html" class="logo text-xl font-bold tracking-tight text-slate-900 hover:opacity-90 transition-opacity">
                    Supreme<span class="font-extrabold text-2xl text-blue-600">Wears</span>
                </a>

                <ul class="nav_links hidden lg:flex justify-around items-center text-sm font-semibold text-slate-600 border border-gray-200 rounded-full px-6 py-2 gap-8 shadow-xs">
                    <li><a href="../index.html" class="hover:text-blue-600 transition-colors duration-200 py-1 border-b-2 border-transparent hover:border-blue-600">Home</a></li>
                    <li><a href="#" class="hover:text-blue-600 transition-colors duration-200 py-1 border-b-2 border-transparent hover:border-blue-600">Shop</a></li>
                    <li><a href="#" class="hover:text-blue-600 transition-colors duration-200 py-1 border-b-2 border-transparent hover:border-blue-600">About</a></li>
                    <li><a href="#" class="hover:text-blue-600 transition-colors duration-200 py-1 border-b-2 border-transparent hover:border-blue-600">Contact</a></li>
                </ul>

                <div class="flex items-center gap-4">
                    <a href="#" class="cart_icon flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-1.5 rounded-full transition-all duration-200 shadow-xs active:scale-95 group">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="size-5 text-gray-200 group-hover:text-white transition-colors">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                        </svg>
                        <span class="text-xs font-semibold bg-blue-600 text-white px-2 py-0.5 rounded-full group-hover:bg-blue-500 transition-colors">0</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN PRODUCT CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- Breadcrumb Link -->
        <nav class="mb-6">
            <a href="../index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
                Back to Catalog
            </a>
        </nav>

        <!-- Product Details Container (Loaded Dynamically) -->
        <div id="product-detail-container" class="bg-white rounded-3xl p-6 md:p-10 border border-gray-200/80 shadow-sm">
            <!-- Loading Skeleton Shell -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 animate-pulse">
                <div class="space-y-4">
                    <div class="aspect-square bg-slate-200 rounded-2xl w-full"></div>
                    <div class="flex gap-4">
                        <div class="size-20 bg-slate-200 rounded-xl"></div>
                        <div class="size-20 bg-slate-200 rounded-xl"></div>
                        <div class="size-20 bg-slate-200 rounded-xl"></div>
                    </div>
                </div>
                <div class="space-y-6 py-4">
                    <div class="h-4 bg-slate-200 rounded w-1/4"></div>
                    <div class="h-8 bg-slate-200 rounded w-3/4"></div>
                    <div class="h-6 bg-slate-200 rounded w-1/3"></div>
                    <div class="h-24 bg-slate-200 rounded w-full"></div>
                    <div class="h-12 bg-slate-200 rounded-full w-full"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full bg-slate-900 text-slate-400 mt-20 rounded-t-3xl border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="description text-center md:text-left">
                <a href="../index.html" class="logo text-2xl font-bold tracking-tight text-white hover:opacity-90 transition-opacity">
                    Supreme<span class="font-extrabold text-2xl text-blue-500">Wears</span>
                </a>
                <p class="text-slate-400 text-sm mt-2 max-w-sm">
                    Bringing premium streetwear and modern fashion directly to your doorstep.
                </p>
            </div>
            <div class="pages">
                <ul class="flex flex-wrap justify-center gap-6 text-sm font-medium text-slate-300">
                    <li><a href="../index.html" class="hover:text-blue-400 transition-colors">Home</a></li>
                    <li><a href="#" class="hover:text-blue-400 transition-colors">Shop</a></li>
                    <li><a href="#" class="hover:text-blue-400 transition-colors">About</a></li>
                    <li><a href="#" class="hover:text-blue-400 transition-colors">Contact</a></li>
                </ul>
            </div>
        </div>
        <div class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
            &copy; 2026 Supreme Wears. All rights reserved.
        </div>
    </footer>

    <script src="../scripts/product-detail.js"></script>
</body>
</html>
