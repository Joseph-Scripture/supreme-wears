<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../styles/index.css">
    <title>Checkout | Supreme Wears</title>
</head>

<body class="bg-gray-50 font-sans antialiased text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200/80">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="../index.html" class="logo text-xl font-bold tracking-tight text-slate-900">
                Supreme<span class="font-extrabold text-2xl text-blue-600">Wears</span>
            </a>
            <a href="cart.html" class="text-xs font-semibold text-slate-600 hover:text-blue-600 transition-colors flex items-center gap-1">
                ← Back to Cart
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 md:px-6 py-10 w-full flex-grow">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-slate-900 mb-8">Checkout</h1>

        <div id="checkout-container" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- LEFT: Checkout Form -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- Contact & Shipping Information -->
                <form id="checkout-form" class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-gray-200/80 shadow-xs">
                        <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-blue-50 text-blue-600 text-xs flex items-center justify-center font-extrabold">1</span>
                            Shipping Information
                        </h2>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="first-name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">First Name</label>
                                <input type="text" id="first-name" required class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:border-blue-600 focus:outline-none transition-all">
                            </div>
                            <div>
                                <label for="last-name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Last Name</label>
                                <input type="text" id="last-name" required class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:border-blue-600 focus:outline-none transition-all">
                            </div>
                            <div class="sm:col-span-2">
                                <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                                <input type="email" id="email" required class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:border-blue-600 focus:outline-none transition-all">
                            </div>
                            <div class="sm:col-span-2">
                                <label for="address" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Street Address</label>
                                <input type="text" id="address" required class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:border-blue-600 focus:outline-none transition-all">
                            </div>
                            <div>
                                <label for="city" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">City</label>
                                <input type="text" id="city" required class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:border-blue-600 focus:outline-none transition-all">
                            </div>
                            <div>
                                <label for="phone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Phone Number</label>
                                <input type="tel" id="phone" required class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:border-blue-600 focus:outline-none transition-all">
                            </div>
                        </div>
                    </div>

                    <!-- Payment Method -->
                    <div class="bg-white p-6 rounded-2xl border border-gray-200/80 shadow-xs">
                        <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-blue-50 text-blue-600 text-xs flex items-center justify-center font-extrabold">2</span>
                            Payment Method
                        </h2>

                        <div class="space-y-3">
                            <label class="flex items-center gap-3 p-3.5 border border-gray-200 rounded-xl cursor-pointer hover:border-blue-500 transition-all">
                                <input type="radio" name="payment-method" value="card" checked class="text-blue-600 focus:ring-blue-500">
                                <span class="text-sm font-semibold text-slate-800">Credit / Debit Card</span>
                            </label>
                            <label class="flex items-center gap-3 p-3.5 border border-gray-200 rounded-xl cursor-pointer hover:border-blue-500 transition-all">
                                <input type="radio" name="payment-method" value="momo" class="text-blue-600 focus:ring-blue-500">
                                <span class="text-sm font-semibold text-slate-800">Mobile Money</span>
                            </label>
                            <label class="flex items-center gap-3 p-3.5 border border-gray-200 rounded-xl cursor-pointer hover:border-blue-500 transition-all">
                                <input type="radio" name="payment-method" value="cod" class="text-blue-600 focus:ring-blue-500">
                                <span class="text-sm font-semibold text-slate-800">Cash on Delivery</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-full text-sm transition-all shadow-md active:scale-[0.99] cursor-pointer">
                        Complete Order
                    </button>
                </form>
            </div>

            <!-- RIGHT: Order Summary -->
            <div class="lg:col-span-5">
                <div class="bg-white p-6 rounded-2xl border border-gray-200/80 shadow-xs sticky top-24">
                    <h2 class="text-base font-bold text-slate-900 mb-4">Order Summary</h2>

                    <!-- Cart Item List -->
                    <div id="checkout-items" class="divide-y divide-gray-100 max-h-80 overflow-y-auto mb-4 pr-1">
                        <!-- Dynamic items rendered by JS -->
                    </div>

                    <!-- Cost Totals -->
                    <div class="border-t border-gray-100 pt-4 space-y-2 text-sm">
                        <div class="flex justify-between text-slate-600">
                            <span>Subtotal</span>
                            <span id="summary-subtotal" class="font-semibold text-slate-900">$0.00</span>
                        </div>
                        <div class="flex justify-between text-slate-600">
                            <span>Estimated Shipping</span>
                            <span id="summary-shipping" class="font-semibold text-slate-900">$5.00</span>
                        </div>
                        <div class="flex justify-between text-slate-900 text-base font-extrabold pt-2 border-t border-gray-100">
                            <span>Total</span>
                            <span id="summary-total" class="text-blue-600">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-gray-200 bg-white py-6 text-center text-xs text-slate-500">
        &copy; 2026 Supreme Wears. Secure Checkout.
    </footer>

    <script type="module" src="../scripts/checkout.js"></script>
</body>
</html>
